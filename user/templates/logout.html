{% extends "base.html" %}

{% block title %}Signed out — DataPulse{% endblock %}

{% block content %}
<section class="auth-shell">
  <div class="container">
    <div class="status-card reveal">
      <span class="empty-art" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M10 5H6.5A1.5 1.5 0 0 0 5 6.5v11A1.5 1.5 0 0 0 6.5 19H10M14 8l4 4-4 4M9 12h9" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </span>
      <h1>You have been signed out</h1>
      <p>Come back soon. There are always more films waiting in the vault.</p>
      <div class="status-actions">
        <a class="btn btn-accent" href="{% url 'home' %}">Back to home</a>
        <a class="btn btn-ghost" href="{% url 'login' %}">Sign in again</a>
      </div>
    </div>
  </div>
</section>
{% endblock %}
