{% extends "base.html" %}

{% block title %}Password updated — DataPulse{% endblock %}

{% block content %}
<section class="auth-shell">
  <div class="container">
    <div class="status-card reveal">
      <span class="empty-art" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="m5.5 12.5 4 4 9-9" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </span>
      <h1>Password updated</h1>
      <p>Your new password is ready. You can now sign in and get back to finding your next film.</p>
      <div class="status-actions">
        <a class="btn btn-accent" href="{% url 'login' %}">Sign in</a>
        <a class="btn btn-ghost" href="{% url 'home' %}">Back to home</a>
      </div>
    </div>
  </div>
</section>
{% endblock %}
