{% extends "base.html" %}
{% load crispy_forms_tags %}

{% block title %}Sign in — DataPulse{% endblock %}

{% block content %}
<section class="auth-shell">
  <div class="container">
    <div class="auth-card reveal">
      <div class="auth-header">
        <span class="auth-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M8 6.5v11l9-5.5-9-5.5Z" fill="currentColor"/></svg>
        </span>
        <h1>Welcome back</h1>
        <p>Sign in to pick up where you left off.</p>
      </div>

      <form method="POST">
        {% csrf_token %}
        {{ form|crispy }}
        <button class="btn btn-accent" type="submit">Sign in</button>
      </form>

      <div class="auth-links">
        <p><a href="{% url 'password_reset' %}">Forgot your password?</a></p>
        <p>New to DataPulse? <a href="{% url 'register' %}">Create an account</a></p>
      </div>
    </div>
  </div>
</section>
{% endblock %}
