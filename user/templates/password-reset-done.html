{% extends "base.html" %}

{% block title %}Check your email — DataPulse{% endblock %}

{% block content %}
<section class="auth-shell">
  <div class="container">
    <div class="status-card reveal">
      <span class="empty-art" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><rect x="3.5" y="5.5" width="17" height="13" rx="2" stroke="currentColor" stroke-width="1.7"/><path d="m5 7 7 5.5L19 7" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </span>
      <h1>Check your inbox</h1>
      <p>If an account exists for that email, we have sent instructions for resetting your password. Remember to check your spam folder.</p>
      <div class="status-actions">
        <a class="btn btn-accent" href="{% url 'home' %}">Back to home</a>
        <a class="btn btn-ghost" href="{% url 'login' %}">Sign in</a>
      </div>
    </div>
  </div>
</section>
{% endblock %}
