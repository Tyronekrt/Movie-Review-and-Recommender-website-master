{% extends "base.html" %}

{% block title %}Delete review — DataPulse{% endblock %}

{% block content %}
<section class="auth-shell">
  <div class="container">
    <div class="status-card">
      <span class="empty-art" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M5 7h14M9 7V5h6v2M7 7l1 12h8l1-12M10 11v5M14 11v5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </span>
      <h1>Delete this review?</h1>
      <p>Your review for <strong>{{ b.title|title }}</strong> will be permanently removed. This cannot be undone.</p>
      <form method="POST">
        {% csrf_token %}
        <div class="status-actions">
          <button class="btn btn-danger-soft" type="submit">Yes, delete review</button>
          <a class="btn btn-ghost" href="{% url 'view_movie' b.id %}">Keep review</a>
        </div>
      </form>
    </div>
  </div>
</section>
{% endblock %}
